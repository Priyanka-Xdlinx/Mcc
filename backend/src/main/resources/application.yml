server:
  port: 8080

spring:
  application:
    name: mcc-backend
  # Browsers must revalidate the UI on every load (a cheap 304 when unchanged),
  # so a rebuilt frontend is never hidden behind a cached index.html.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

mcc:
  # Decode schema, telemetry and display pages. store.DecodeSchemaLoader fills
  # the decode tables from xdos/ the first time this file has none.
  db: ${MCC_DB:../mcc.db}
  # Where the launcher token and the first admin's one-time password file go
  # (the repository root, where mcc.py looks for them).
  data-dir: ${MCC_DATA_DIR:..}
  # The XDLINX tree the decode schema is built from, on a fresh mcc.db.
  xdos-home: ${MCC_XDOS_HOME:../xdos}
  feed:
    host: 127.0.0.1
    port: 9100
    # Refuse to decode unless the flown LUT matches the one the schema was built
    # from. Position inside a tier is the ONLY link between the OBC and the
    # ground; a mismatched twin reads every value from the wrong offset and
    # still looks completely plausible.
    enforce-crc: true
    reconnect-delay-ms: 1000
  history:
    enabled: true
    # About 350 rows/sec: VH completes every subframe, H every 2, M every 4,
    # L every 8. That is ~230 MB/hour, so the cap has to be real and the pruner
    # has to actually run (IngestService.prune, every 30s).
    max-rows: 500000

  # Username/password sign-in; see com.orblinx.mcc.auth.AuthProperties.
  # Accounts, sessions and the token signing keys are in their own file, apart
  # from the decode/telemetry/display data in mcc.db.
  auth:
    db: ${MCC_AUTH_DB:../mcc-auth.db}
    # Browsers accept Secure cookies on http://localhost; set false only to
    # serve plain http under another host name.
    secure-cookies: ${MCC_SECURE_COOKIES:true}
    # First start only (no accounts yet): this admin is created. Without a
    # password here one is generated into mcc-admin-password.txt in data-dir.
    # Either way it must be changed at first sign-in.
    bootstrap-admin: ${MCC_ADMIN_USER:admin}
    bootstrap-password: ${MCC_ADMIN_PASSWORD:}
    access-ttl: 15m
    refresh-ttl: 7d
    # Lock an account for 15 minutes after 5 wrong passwords in a row.
    max-failed-logins: 5
    lockout: 15m
    # At most 20 sign-in attempts per address per 5 minutes.
    logins-per-ip: 20
    login-window: 5m

logging:
  level:
    com.orblinx.mcc: INFO

# API documentation: the OpenAPI description and Swagger UI, both served by
# this backend and shown inside the dashboard's Docs page.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
    # "Try it out" echoes the XSRF-TOKEN cookie, which writes need once signed in.
    csrf:
      enabled: true
  paths-to-match: /api/**
