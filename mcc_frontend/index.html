<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrbLinx MCC</title>
    <style>
      body { margin: 0; }
      /* Static boot screen: on screen from the first byte of HTML, taken down
         by hideBootLoader() once the session check settles (see BootGate). */
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1115;
        color: #8896a0;
        font: 14px system-ui, sans-serif;
        z-index: 2147483647;
      }
    </style>
    <script>
      // Apply the remembered theme before the first paint (key shared with uiSlice).
      (function () {
        try {
          var t = localStorage.getItem("mcc.theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (ignored) {
          /* private mode: the OS preference applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-label="Loading OrbLinx MCC">Loading OrbLinx MCC…</div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
